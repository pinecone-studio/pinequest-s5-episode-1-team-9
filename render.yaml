# Render Blueprint for the LinguaMatch API (Express + Socket.IO).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for on
# first deploy and never stored in git.
services:
  - type: web
    name: linguamatch-api
    runtime: node
    plan: free
    # Same region as the Neon database (ap-southeast-1): every query would otherwise cross the Pacific.
    # Render can't move an existing service, so changing this means creating a new one.
    region: singapore
    rootDir: server
    # The server imports the `shared` workspace, so install from the repo root (one level up).
    buildCommand: cd .. && npm ci --workspace server --include-workspace-root=false
    startCommand: npm start
    healthCheckPath: /health
    # The matchmaking queue lives in memory: run exactly one instance.
    numInstances: 1
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
        - shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Exact web origin(s), comma-separated. Add Vercel preview URLs here if you use them.
      - key: CLIENT_ORIGIN
        value: https://linguamatch-taupe.vercel.app
      # Neon pooled connection string (the `-pooler` host).
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      # TURN relay for peers behind strict NATs. Use Cloudflare, or TURN_URL + TURN_SHARED_SECRET.
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
