<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Incoming friend call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#14123A}
.lm-pulse{animation:lmPulse 1.6s ease-out infinite}
@keyframes lmPulse{from{box-shadow:0 0 0 0 rgba(240,165,50,.55)}to{box-shadow:0 0 0 22px rgba(240,165,50,0)}}
@media (prefers-reduced-motion: reduce){.lm-pulse{animation:none}}
button:focus-visible{outline:3px solid #F0A532;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; background: #14123A; color: #FFFFFF; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column;">
  <div aria-hidden="true" style="flex: 1; display: flex; flex-direction: column; opacity: 0.35;">
    <div style="padding: 14px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.08);">
      <span style="display: flex; gap: 3px;"><span style="display: block; width: 22px; height: 12px; border-radius: 6px; background: #3B63E8;"></span><span style="display: block; width: 14px; height: 12px; border-radius: 6px; background: #F0A532;"></span></span>
      <span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 19px;">LinguaMatch</span>
    </div>
    <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px 24px;">
      <div style="flex: 999 1 640px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-content: start;">
        <div style="aspect-ratio: 4 / 3; border-radius: 22px; background: #1F1C4F; border: 3px dashed rgba(240,165,50,0.6);"></div>
        <div style="aspect-ratio: 4 / 3; border-radius: 22px; background: #232C6E; border: 3px solid #3B63E8;"></div>
      </div>
      <div style="flex: 1 1 320px; border-radius: 22px; background: #1F1C4F; min-height: 400px;"></div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(10,9,32,0.55); display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div role="dialog" aria-modal="true" aria-labelledby="call-title" aria-describedby="call-desc" style="width: 100%; max-width: 420px; background: #FFFFFF; color: #1C1A45; border-radius: 28px; padding: 32px 28px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; box-sizing: border-box;">
      <span class="lm-pulse" aria-hidden="true" style="width: 104px; height: 104px; border-radius: 50%; background: #F0A532; color: #1C1A45; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 40px;">M</span>
      <h2 id="call-title" style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 24px;">Maya is calling</h2>
      <p id="call-desc" style="margin: 0; color: #4E537A; line-height: 1.5;">Video call in English. Maya is your friend at B1.</p>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 6px;">
        <div aria-hidden="true" style="height: 6px; border-radius: 3px; background: #EEF0F7; overflow: hidden;"><span style="display: block; width: 80%; height: 100%; background: #F0A532;"></span></div>
        <span style="font-size: 14px; color: #5B6085;">Answer within 24 seconds</span>
      </div>
      <div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 6px;">
        <button type="button" style="min-height: 54px; border: 1px solid #D6DAEA; border-radius: 16px; background: #FFFFFF; color: #1C1A45; font: 700 17px 'Onest', sans-serif; cursor: pointer;">Decline</button>
        <button type="button" style="min-height: 54px; border: 0; border-radius: 16px; background: #23A86B; color: #FFFFFF; font: 700 17px 'Onest', sans-serif; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>Accept</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
